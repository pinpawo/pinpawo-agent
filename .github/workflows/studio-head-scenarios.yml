name: Studio Head scenarios

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic:
    name: Deterministic Timeline scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGCHAIN_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      LANGSMITH_TRACING_V2: 'false'
      LANGFUSE_TRACING_ENABLED: 'false'
      STUDIO_SCENARIO_REPORT: ${{ github.workspace }}/tests/studio-e2e/artifacts/pet-head-scenarios/offline-report.json
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build scenario prerequisites
        run: |
          npm run build -w @pinpawo-toolkit/browser
          npm run build -w @pinpawo/agent-contracts
          npm run build -w @pinpawo/agent-session
          npm run build -w @pinpawo/pet-agent
          npm run build -w pinpawo
          npm run build -w @pinpawo/studio-core
          npm run build -w @pinpawo-plugin/channel
      - name: Run deterministic scenarios
        run: npm run test:scenarios -w @pinpawo-tests/studio-e2e
      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-head-scenarios-${{ github.run_attempt }}
          path: tests/studio-e2e/artifacts/pet-head-scenarios/offline-report.json
          if-no-files-found: warn
          retention-days: 3
