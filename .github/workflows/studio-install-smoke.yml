name: Studio install smoke

on:
  pull_request:
    paths:
      - '.github/workflows/studio-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'packages/studio/**'
      - 'services/local-agent/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/studio-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'packages/studio/**'
      - 'services/local-agent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Pack, install, and check Studio
        run: npm run test:install -w @pinpawo/studio
