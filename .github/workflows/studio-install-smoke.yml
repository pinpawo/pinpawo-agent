name: Studio install smoke

on:
  pull_request:
    paths:
      - '.github/workflows/studio-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'packages/studio/**'
      - 'services/host/**'
      # host bundles the Browser Toolkit; Studio also packs the plugins.
      - 'toolkits/**'
      - 'plugins/**'
      # Tests, docs and unrelated scripts never reach a packed package.
      - '!**/*.test.ts'
      - '!**/*.md'
      - '!services/host/scripts/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/studio-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'packages/studio/**'
      - 'services/host/**'
      # host bundles the Browser Toolkit; Studio also packs the plugins.
      - 'toolkits/**'
      - 'plugins/**'
      # Tests, docs and unrelated scripts never reach a packed package.
      - '!**/*.test.ts'
      - '!**/*.md'
      - '!services/host/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request supersedes the run for an older one;
# runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests pack and install on Linux only; the full OS matrix runs
        # after merge, where a macOS or Windows break still surfaces. Windows
        # alone took ~9 minutes per job and gated every pull request.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Pack, install, and check Studio
        run: npm run test:install -w @pinpawo/studio
      - name: Locate npm logs
        if: failure()
        shell: bash
        run: echo "NPM_LOG_DIR=$(npm config get cache)/_logs" >> "$GITHUB_ENV"
      - name: Upload npm failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-npm-logs-${{ matrix.os }}
          path: ${{ env.NPM_LOG_DIR }}
          retention-days: 3
