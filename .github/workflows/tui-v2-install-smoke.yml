name: TUI v2 install smoke

on:
  pull_request:
    paths:
      - '.github/workflows/tui-v2-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/pet-agent/**'
      - 'services/local-agent/**'
      - 'services/tui/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tui-v2-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/pet-agent/**'
      - 'services/local-agent/**'
      - 'services/tui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Pack, install, and check TUI v2
        run: npm run test:tui-install -w pinpawo
