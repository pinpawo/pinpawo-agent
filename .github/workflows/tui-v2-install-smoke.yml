name: TUI v2 install smoke

on:
  pull_request:
    paths:
      - '.github/workflows/tui-v2-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'services/host/**'
      - 'services/tui/**'
      # host bundles the Browser Toolkit.
      - 'toolkits/**'
      # Tests, docs and unrelated scripts never reach a packed package.
      - '!**/*.test.ts'
      - '!**/*.md'
      - '!services/host/scripts/**'
      - 'services/host/scripts/tui-v2-install-smoke.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tui-v2-install-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/agent-contracts/**'
      - 'packages/agent-session/**'
      - 'packages/pet-agent/**'
      - 'services/host/**'
      - 'services/tui/**'
      # host bundles the Browser Toolkit.
      - 'toolkits/**'
      # Tests, docs and unrelated scripts never reach a packed package.
      - '!**/*.test.ts'
      - '!**/*.md'
      - '!services/host/scripts/**'
      - 'services/host/scripts/tui-v2-install-smoke.ts'
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same pull request supersedes the run for an older one;
# runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pull requests pack and install on Linux only; the full OS matrix runs
        # after merge, where a macOS or Windows break still surfaces. Windows
        # alone took ~9 minutes per job and gated every pull request.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck TUI v2
        run: npm run typecheck -w @pinpawo/tui
      - name: Pack, install, and check TUI v2
        run: npm run test:tui-install -w pinpawo
