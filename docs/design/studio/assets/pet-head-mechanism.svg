<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Pet Head system structure</title>
  <desc id="desc">Committed Channel Timeline messages reach a Pet Head through the Studio EventBus. The Head requests execution through the Channel port and Studio Dispatch. The resident Pet Agent reports scoped lifecycle through the same EventBus. Channel's existing bridge commits public replies back to the Timeline. The Channel port validates membership and Session binding before sampling the exact current dispatch's bound Session.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#425b7b"/>
    </marker>
    <marker id="read-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7150a0"/>
    </marker>
  </defs>

  <rect x="7" y="7" width="986" height="466" rx="22" fill="#fff" stroke="#d8e2ef"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="36" y="49" font-size="26" font-weight="700" fill="#132a45">Pet Head system structure</text>
    <text x="36" y="73" font-size="15" fill="#435874">One Pet instance in its owner Channel</text>

    <g stroke-width="1.5">
      <rect x="36" y="106" width="218" height="78" rx="12" fill="#f1f6fc" stroke="#afc7e2"/>
      <rect x="390" y="106" width="220" height="78" rx="12" fill="#edf3fe" stroke="#a0bce3"/>
      <rect x="748" y="106" width="214" height="78" rx="12" fill="#e8f6f2" stroke="#80b9a6"/>
      <rect x="36" y="306" width="218" height="78" rx="12" fill="#f5f0fc" stroke="#c5afe0"/>
      <rect x="390" y="306" width="220" height="78" rx="12" fill="#f1f6fc" stroke="#afc7e2"/>
      <rect x="748" y="306" width="214" height="78" rx="12" fill="#f1f6fc" stroke="#afc7e2"/>
    </g>

    <g text-anchor="middle" font-size="17" font-weight="700" fill="#132a45">
      <text x="145" y="140">Channel Timeline</text>
      <text x="500" y="140">Studio EventBus</text>
      <text x="855" y="140">Pet Head</text>
      <text x="145" y="340">Agent Session</text>
      <text x="500" y="340">Resident Pet Agent</text>
      <text x="855" y="340">Channel port</text>
    </g>
    <g text-anchor="middle" font-size="13" fill="#435874">
      <text x="145" y="161">Committed Human / Pet messages</text>
      <text x="500" y="161">Live, source + topic</text>
      <text x="855" y="161">Judgment + validated decision</text>
      <text x="145" y="361">Own, current Channel binding</text>
      <text x="500" y="361">Queue, run and review</text>
      <text x="855" y="361">→ Studio Dispatch</text>
    </g>

    <g fill="none" stroke="#425b7b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M254 134H385"/>
      <path d="M390 164H260"/>
      <path d="M610 145H742"/>
      <path d="M855 184V300"/>
      <path d="M748 345H616"/>
      <path d="M500 306V190"/>
      <path d="M390 345H260"/>
    </g>
    <g font-size="13" fill="#334c6c">
      <text x="322" y="123" text-anchor="middle">committed event</text>
      <text x="322" y="183" text-anchor="middle">public reply bridge</text>
      <text x="679" y="133" text-anchor="middle">Channel topic</text>
      <text x="844" y="243" text-anchor="end">reply / dispatch / status</text>
      <text x="679" y="334" text-anchor="middle">admission</text>
      <text x="512" y="241">dispatch.*</text>
      <text x="512" y="260">Pet topic + Channel scope</text>
      <text x="322" y="334" text-anchor="middle">Session state</text>
    </g>

    <path d="M855 384V434H145V391" fill="none" stroke="#7150a0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#read-arrow)"/>
    <text x="550" y="421" text-anchor="middle" font-size="14" font-weight="600" fill="#63468d">After Channel authorization: one scoped Session status sample</text>
  </g>
</svg>
