<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f6f4ff"/>
  <circle cx="1120" cy="90" r="190" fill="#ece7ff"/>
  <circle cx="90" cy="760" r="210" fill="#fff0e6"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 54)">
      <rect width="52" height="52" rx="14" fill="#6d47d9"/>
      <path d="M14 18h24v16H14z" fill="none" stroke="#fff" stroke-width="3" rx="2"/>
      <path d="M18 14v8M34 14v8" stroke="#ff9f43" stroke-width="4" stroke-linecap="round"/>
      <path d="M22 26h8" stroke="#ff9f43" stroke-width="4" stroke-linecap="round"/>
      <text x="72" y="24" font-size="24" font-weight="700" fill="#25184d">PinPawo Browser Bridge</text>
      <text x="72" y="49" font-size="15" fill="#675f7d">Connect one approved Chrome tab to your local agent</text>
    </g>

    <g transform="translate(64 145)">
      <rect width="730" height="500" rx="22" fill="#ffffff" stroke="#d8d2e8" stroke-width="2"/>
      <rect width="730" height="62" rx="22" fill="#2d2540"/>
      <rect y="40" width="730" height="22" fill="#2d2540"/>
      <circle cx="26" cy="31" r="7" fill="#ff6b6b"/>
      <circle cx="50" cy="31" r="7" fill="#ffd166"/>
      <circle cx="74" cy="31" r="7" fill="#65d18a"/>
      <rect x="112" y="17" width="500" height="30" rx="15" fill="#4a405f"/>
      <circle cx="132" cy="32" r="6" fill="#65d18a"/>
      <text x="148" y="37" font-size="13" fill="#efeafb">https://example.com/workspace</text>
      <rect x="670" y="15" width="34" height="34" rx="10" fill="#6d47d9"/>
      <path d="M678 25h18v13h-18z" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M682 21v7M692 21v7" stroke="#ffad5c" stroke-width="3" stroke-linecap="round"/>

      <g transform="translate(34 92)">
        <rect width="662" height="65" rx="14" fill="#f0ecff"/>
        <circle cx="34" cy="32" r="17" fill="#6d47d9"/>
        <path d="M26 31h16M34 23v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="64" y="27" font-size="15" font-weight="700" fill="#33265c">This tab is explicitly bound to PinPawo</text>
        <text x="64" y="48" font-size="13" fill="#6a6080">Only this approved origin is available to the agent.</text>

        <text x="0" y="112" font-size="14" font-weight="600" fill="#857b99">DEMO PAGE</text>
        <text x="0" y="153" font-size="31" font-weight="750" fill="#281b50">Product workspace</text>
        <text x="0" y="181" font-size="15" fill="#675f7d">Review visible options and ask the local agent to interact.</text>

        <rect x="0" y="216" width="192" height="122" rx="15" fill="#fbfaff" stroke="#e2ddec"/>
        <rect x="214" y="216" width="192" height="122" rx="15" fill="#fbfaff" stroke="#e2ddec"/>
        <rect x="428" y="216" width="192" height="122" rx="15" fill="#fbfaff" stroke="#e2ddec"/>
        <circle cx="30" cy="246" r="13" fill="#ffe3cd"/>
        <circle cx="244" cy="246" r="13" fill="#e2d9ff"/>
        <circle cx="458" cy="246" r="13" fill="#d9f6e3"/>
        <text x="18" y="284" font-size="15" font-weight="700" fill="#33265c">Snapshot</text>
        <text x="232" y="284" font-size="15" font-weight="700" fill="#33265c">Interact</text>
        <text x="446" y="284" font-size="15" font-weight="700" fill="#33265c">Capture</text>
        <text x="18" y="308" font-size="13" fill="#736a87">Read visible content</text>
        <text x="232" y="308" font-size="13" fill="#736a87">Click, type, scroll</text>
        <text x="446" y="308" font-size="13" fill="#736a87">Take a screenshot</text>
        <rect x="0" y="365" width="168" height="42" rx="12" fill="#6d47d9"/>
        <text x="23" y="392" font-size="14" font-weight="700" fill="#fff">Continue with agent</text>
        <rect x="182" y="365" width="112" height="42" rx="12" fill="#fff" stroke="#cfc7e2"/>
        <text x="207" y="392" font-size="14" font-weight="700" fill="#4c4162">Detach</text>
      </g>
    </g>

    <g transform="translate(824 145)">
      <rect width="392" height="500" rx="22" fill="#211a33"/>
      <text x="26" y="38" font-size="13" font-weight="700" fill="#a99cc5">LOCAL-AGENT</text>
      <circle cx="347" cy="33" r="5" fill="#65d18a"/>
      <text x="359" y="38" font-size="12" fill="#a99cc5">connected</text>

      <rect x="24" y="66" width="344" height="91" rx="15" fill="#372d4d"/>
      <text x="42" y="92" font-size="12" font-weight="700" fill="#bcb0d4">YOU</text>
      <text x="42" y="120" font-size="15" fill="#fff">Inspect the approved page and</text>
      <text x="42" y="142" font-size="15" fill="#fff">summarize its visible options.</text>

      <rect x="24" y="174" width="344" height="139" rx="15" fill="#2c2441" stroke="#594576"/>
      <text x="42" y="202" font-size="12" font-weight="700" fill="#ffad5c">PINPAWO</text>
      <text x="42" y="231" font-size="14" fill="#eee9fa">Connected to the approved tab.</text>
      <text x="42" y="255" font-size="14" fill="#eee9fa">Snapshot captured with 3 indexed</text>
      <text x="42" y="279" font-size="14" fill="#eee9fa">interactive elements.</text>
      <rect x="42" y="290" width="128" height="23" rx="8" fill="#493a67"/>
      <text x="54" y="306" font-size="11" fill="#d6cbed">origin verified</text>

      <rect x="24" y="334" width="344" height="123" rx="15" fill="#171222"/>
      <text x="42" y="362" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#9f92bd">browser_snapshot</text>
      <text x="42" y="388" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#79dfa0">status: complete</text>
      <text x="42" y="412" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#c8bedc">truncated: false</text>
      <text x="42" y="436" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#c8bedc">backend: chrome-extension</text>
    </g>

    <g transform="translate(64 688)">
      <rect width="1152" height="72" rx="18" fill="#ffffff" stroke="#ded8ec"/>
      <g transform="translate(26 19)">
        <circle cx="17" cy="17" r="17" fill="#f0ecff"/>
        <path d="M10 17l5 5 10-11" fill="none" stroke="#6d47d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#33265c">Explicit tab approval</text>
        <text x="48" y="34" font-size="12" fill="#756b89">You choose what gets connected.</text>
      </g>
      <g transform="translate(405 19)">
        <circle cx="17" cy="17" r="17" fill="#fff0e5"/>
        <path d="M17 8l8 4v6c0 6-4 10-8 12-4-2-8-6-8-12v-6z" fill="none" stroke="#e9802d" stroke-width="2.5"/>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#33265c">Origin guard</text>
        <text x="48" y="34" font-size="12" fill="#756b89">Cross-origin changes require review.</text>
      </g>
      <g transform="translate(790 19)">
        <circle cx="17" cy="17" r="17" fill="#eaf9ef"/>
        <path d="M10 17h14M13 12l-5 5 5 5M21 12l5 5-5 5" fill="none" stroke="#38a164" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#33265c">Local Native Messaging</text>
        <text x="48" y="34" font-size="12" fill="#756b89">The bridge talks to your local-agent.</text>
      </g>
    </g>
  </g>
</svg>
