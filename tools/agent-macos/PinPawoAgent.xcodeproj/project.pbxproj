\"\nelse\n  NODE_SRC=\"$(first_portable_node \\\n    \"$SHELL_NODE\" \\\n    $NVM_CANDIDATES \\\n    \"$PATH_NODE\")\"\nfi\nif [ -z \"$NODE_SRC\" ] || [ ! -x \"$NODE_SRC\" ]; then\n  echo \"error: unable to find a portable Node.js binary to bundle.\" >&2\n  echo \"error: the bundled node must not depend on external Homebrew/macPorts libraries such as libuv.\" >&2\n  echo \"error: set PINPAWO_NODE_PATH to a self-contained Node binary, for example an nvm-installed node.\" >&2\n  exit 1\nfi\nNODE_VERSION=\"$(\"$NODE_SRC\" -v 2>/dev/null || true)\"\nif ! node_version_ok \"$NODE_VERSION\"; then\n  echo \"error: bundled Node version must be 20.x, got '${NODE_VERSION:-unknown}' from $NODE_SRC.\" >&2\n  echo \"error: update PINPAWO_NODE_PATH or your local Node installation to match .nvmrc.\" >&2\n  exit 1\nfi\nNODE_ARCH=\"$(\"$NODE_SRC\" -p 'process.arch' 2>/dev/null || true)\"\ncase \"$NODE_ARCH\" in\n  x64) NODE_MACH_ARCH=\"x86_64\" ;;\n  arm64) NODE_MACH_ARCH=\"arm64\" ;;\n  *)\n    echo \"error: bundled Node architecture must be x64 or arm64, got '${NODE_ARCH:-unknown}' from $NODE_SRC.\" >&2\n    exit 1\n    ;;\nesac\nNODE_DST=\"${RES_DIR}/bin/node\"\nNODE_ENTITLEMENTS=\"${SRCROOT}/PinPawoAgent/NodeRuntime.entitlements\"\nmkdir -p \"$(dirname \"$NODE_DST\")\"\ncp -fL \"$NODE_SRC\" \"$NODE_DST\"\nchmod 755 \"$NODE_DST\"\nSIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\n/usr/bin/codesign \\\n  --force \\\n  --sign \"$SIGN_IDENTITY\" \\\n  --entitlements \"$NODE_ENTITLEMENTS\" \\\n  --options runtime \\\n  \"$NODE_DST\"\n\n# dist\necho \"Building local agent runtime...\"\n(cd \"$AGENT_SRC\" && PATH=\"$(dirname \"$NODE_SRC\"):$PATH\" npm run build)\nDIST_DST=\"${RES_DIR}/dist\"\nmkdir -p \"$DIST_DST\"\nrsync -a --delete \"$AGENT_SRC/dist/\" \"$DIST_DST/\"\n\n# node_modules: copy local-agent runtime deps plus explicitly externalized\n# workspace-root packages. Do not copy the complete workspace dependency tree.\nNM_DST=\"${RES_DIR}/node_modules\"\nmkdir -p \"$NM_DST\"\nrsync -a --delete \"$AGENT_SRC/node_modules/\" \"$NM_DST/\"\n\nRG_PACKAGE_SRC=\"${WORKSPACE_ROOT}/node_modules/@vscode/ripgrep\"\nRG_PLATFORM_PACKAGE=\"ripgrep-darwin-${NODE_ARCH}\"\nRG_PLATFORM_SRC=\"${WORKSPACE_ROOT}/node_modules/@vscode/${RG_PLATFORM_PACKAGE}\"\nif [ ! -d \"$RG_PACKAGE_SRC\" ] || [ ! -d \"$RG_PLATFORM_SRC\" ]; then\n  echo \"error: missing @vscode/ripgrep package for bundled Node architecture ${NODE_ARCH}.\" >&2\n  echo \"error: install workspace dependencies with a Node/npm target matching $NODE_SRC.\" >&2\n  exit 1\nfi\nmkdir -p \"$NM_DST/@vscode\"\nrsync -a --delete \"$RG_PACKAGE_SRC/\" \"$NM_DST/@vscode/ripgrep/\"\nrsync -a --delete \"$RG_PLATFORM_SRC/\" \"$NM_DST/@vscode/${RG_PLATFORM_PACKAGE}/\"\n\nRG_BIN=\"$NM_DST/@vscode/${RG_PLATFORM_PACKAGE}/bin/rg\"\nRG_ARCHS=\"$(/usr/bin/lipo -archs \"$RG_BIN\" 2>/dev/null || true)\"\ncase \" $RG_ARCHS \" in\n  *\" $NODE_MACH_ARCH \"*) ;;\n  *)\n    echo \"error: bundled ripgrep architectures '${RG_ARCHS:-unknown}' do not include Node architecture $NODE_MACH_ARCH.\" >&2\n    exit 1\n    ;;\nesac\nchmod 755 \"$RG_BIN\"\n/usr/bin/codesign \\\n  --force \\\n  --sign \"$SIGN_IDENTITY\" \\\n  --options runtime \\\n  \"$RG_BIN\"\n\"$RG_BIN\" --version >/dev/null\n(\n  cd \"$RES_DIR\"\n  npm_config_arch=\"$NODE_ARCH\" \"$NODE_DST\" --input-type=module --eval \\\n    \"const { realpathSync } = await import('node:fs'); const { rgPath } = await import('@vscode/ripgrep'); if (realpathSync(rgPath) !== realpathSync(process.argv[1])) throw new Error(\\`unexpected ripgrep path: \\${rgPath}\\`);\" \\\n    \"$RG_BIN\"\n)\n";
