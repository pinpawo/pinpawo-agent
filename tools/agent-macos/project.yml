name: PinPawoAgent
options:
  bundleIdPrefix: app.pinpawo
  deploymentTarget:
    macOS: '13.0'
  xcodeVersion: '15.0'
  createIntermediateGroups: true

schemes:
  PinPawoAgent:
    build:
      targets:
        PinPawoAgent: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  PinPawoAgent:
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - path: PinPawoAgent
    resources:
      - path: PinPawoAgent/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinpawo.agent
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: PinPawoAgent/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R3WSWC6S6F
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: PinPawoAgent/PinPawoAgent.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: true
    postBuildScripts:
      - name: Copy agent runtime into bundle
        script: |
          AGENT_SRC="${SRCROOT}/../../services/local-agent"
          RES_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          RELEASE_ENV_FILE="${SRCROOT}/release.env"
          mkdir -p "$RES_DIR"

          node_has_external_deps() {
            /usr/bin/otool -L "$1" 2>/dev/null | /usr/bin/tail -n +2 | /usr/bin/awk '{print $1}' | \
              /usr/bin/grep -E -v '^(/System/|/usr/lib/|@rpath/|@executable_path/|@loader_path/)' >/dev/null
          }

          first_portable_node() {
            for candidate in "$@"; do
              [ -n "$candidate" ] || continue
              [ -x "$candidate" ] || continue
              if node_has_external_deps "$candidate"; then
                continue
              fi
              echo "$candidate"
              return 0
            done
            return 1
          }

          node_version_ok() {
            case "$1" in
              v20.*) return 0 ;;
              *) return 1 ;;
            esac
          }

          SHELL_NODE="$(/bin/zsh -lc 'command -v node' 2>/dev/null || true)"
          PATH_NODE="$(command -v node 2>/dev/null || true)"
          NVM_CANDIDATES=""
          for candidate in "$HOME"/.nvm/versions/node/*/bin/node; do
            [ -e "$candidate" ] || continue
            NVM_CANDIDATES="${NVM_CANDIDATES}${candidate}
          "
          done

          # Release builds use a checked-in template plus a local release.env file for
          # stable Xcode Archive behavior. Environment variables still override the file.
          if [ -z "${PINPAWO_NODE_PATH:-}" ] && [ -f "$RELEASE_ENV_FILE" ]; then
            set -a
            . "$RELEASE_ENV_FILE"
            set +a
          fi

          # Bundle a concrete Node runtime so the app is self-contained on target machines.
          if [ "${CONFIGURATION}" = "Release" ] && [ -z "${PINPAWO_NODE_PATH:-}" ]; then
            echo "error: Release builds require PINPAWO_NODE_PATH in tools/agent-macos/release.env or the build environment." >&2
            echo "error: copy tools/agent-macos/release.env.example to tools/agent-macos/release.env and set your local Node 20 path." >&2
            exit 1
          fi

          if [ -n "${PINPAWO_NODE_PATH:-}" ]; then
            NODE_SRC="$(first_portable_node "${PINPAWO_NODE_PATH}")"
          else
            NODE_SRC="$(first_portable_node \
              "$SHELL_NODE" \
              $NVM_CANDIDATES \
              "$PATH_NODE")"
          fi
          if [ -z "$NODE_SRC" ] || [ ! -x "$NODE_SRC" ]; then
            echo "error: unable to find a portable Node.js binary to bundle." >&2
            echo "error: the bundled node must not depend on external Homebrew/macPorts libraries such as libuv." >&2
            echo "error: set PINPAWO_NODE_PATH to a self-contained Node binary, for example an nvm-installed node." >&2
            exit 1
          fi
          NODE_VERSION="$("$NODE_SRC" -v 2>/dev/null || true)"
          if ! node_version_ok "$NODE_VERSION"; then
            echo "error: bundled Node version must be 20.x, got '${NODE_VERSION:-unknown}' from $NODE_SRC." >&2
            echo "error: update PINPAWO_NODE_PATH or your local Node installation to match .nvmrc." >&2
            exit 1
          fi
          NODE_DST="${RES_DIR}/bin/node"
          NODE_ENTITLEMENTS="${SRCROOT}/PinPawoAgent/NodeRuntime.entitlements"
          mkdir -p "$(dirname "$NODE_DST")"
          cp -fL "$NODE_SRC" "$NODE_DST"
          chmod 755 "$NODE_DST"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign \
            --force \
            --sign "$SIGN_IDENTITY" \
            --entitlements "$NODE_ENTITLEMENTS" \
            --options runtime \
            "$NODE_DST"

          # dist
          echo "Building local agent runtime..."
          (cd "$AGENT_SRC" && PATH="$(dirname "$NODE_SRC"):$PATH" npm run build)
          DIST_DST="${RES_DIR}/dist"
          mkdir -p "$DIST_DST"
          rsync -a --delete "$AGENT_SRC/dist/" "$DIST_DST/"

          # node_modules: only copy local-agent runtime deps.
          # Do not bundle workspace-root node_modules or external browser helpers.
          NM_DST="${RES_DIR}/node_modules"
          mkdir -p "$NM_DST"
          rsync -a --delete "$AGENT_SRC/node_modules/" "$NM_DST/"
